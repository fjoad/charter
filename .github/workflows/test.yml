name: Plugin Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  verify:
    name: Structural + behavioral checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python (used by hooks for JSON encoding)
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Run verify-plugin.sh
        run: bash scripts/verify-plugin.sh
